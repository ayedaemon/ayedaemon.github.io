baseURL: "https://ayedaemon.github.io/"
title: Connected

theme: ["PaperMod"]
pagination:
  pagerSize: 5

## Outputs
outputs:
  home:
    - HTML
    - RSS
    - JSON
## Params
params:
  title: Connected
  description: "ayedaemon dumps his blogs here"
  keywords: [Blog, Portfolio, PaperMod]
  author: ["ayedaemon"]
  DateFormat: "January 2, 2006"
  defaultTheme: dark # dark, light
  disableThemeToggle: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # home-info mode
  homeInfoParams:
    Title: "Ayedaemon"
    Content: An Information Security Engineer from India who is interested in DevOps culture and Security that isn’t based on Excel.

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/ayedaemon/"
    - name: mastodon
      url: "https://social.linux.pizza/@ayedaemon"
    - name: email
      url: mailto:ayedaemon@gmail.com

## Languages
languages:
  en:
    languageName: "English"
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - identifier: archives
          name: Archives
          url: /archives/
          weight: 10
        - identifier: series
          name: Series
          url: /series/
          weight: 20
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 30
        - identifier: search
          name: Search
          url: /search/
          weight: 40

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
